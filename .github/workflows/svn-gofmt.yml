name: Format SVN revision review code
on:
  push:
    branches:
      - feat/sync-upstream-svn-revision-review-20261012
permissions:
  contents: write
jobs:
  gofmt:
    if: github.repository == 'smallfishworld/open-code-review-svn'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format changed Go code and commit
        shell: bash
        run: |
          set -euo pipefail
          gofmt -s -w cmd/opencodereview/review_cmd.go cmd/opencodereview/shared.go cmd/opencodereview/shared_test.go cmd/opencodereview/delegate_cmd.go internal/agent/agent.go internal/diff/git.go internal/diff/parser.go internal/diff/svn.go internal/diff/svn_revision_test.go internal/tool/filereader.go
          rm .github/workflows/svn-gofmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'style: gofmt SVN revision implementation'
          git push origin HEAD:feat/sync-upstream-svn-revision-review-20261012
