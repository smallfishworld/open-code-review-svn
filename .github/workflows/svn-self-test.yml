name: SVN Revision Self Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  svn-review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Subversion
        run: |
          if ! command -v svnadmin >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y subversion
          fi
          svn --version --quiet
          go version
      - name: Check formatting of touched files
        run: |
          set -e
          files="cmd/opencodereview/review_cmd.go cmd/opencodereview/shared.go cmd/opencodereview/shared_test.go cmd/opencodereview/delegate_cmd.go internal/agent/agent.go internal/diff/git.go internal/diff/parser.go internal/diff/svn.go internal/diff/svn_revision_test.go internal/tool/filereader.go"
          test -z "$(gofmt -l $files)"
      - name: Build CLI
        run: go build ./cmd/opencodereview
      - name: Run SVN diff tests
        run: go test -count=1 -v ./internal/diff -run 'Test(SVN|ConvertSVN)'
      - name: Run review validation tests
        run: go test -count=1 -v ./cmd/opencodereview -run 'Test(ValidateRepositoryReviewMode|ResolveWorkingDirSVNSubdirectory)'
      - name: Test real CLI revision and preview in SVN checkout
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          svnadmin create "$tmp/repo"
          svn checkout "file://$tmp/repo" "$tmp/wc"
          echo 'int value=1;' > "$tmp/wc/main.c"
          svn add "$tmp/wc/main.c"
          svn commit "$tmp/wc" -m initial
          echo 'int value=2;' > "$tmp/wc/main.c"
          svn commit "$tmp/wc" -m second
          echo 'UNCOMMITTED' > "$tmp/wc/main.c"
          timeout 40s ./opencodereview review --repo "$tmp/wc" --commit 2 --preview --format json > "$tmp/commit.json"
          timeout 40s ./opencodereview review --repo "$tmp/wc" --from 1 --to 2 --preview --format json > "$tmp/range.json"
          timeout 40s ./opencodereview review --repo "$tmp/wc" --preview --format json > "$tmp/workspace.json"
          grep -q main.c "$tmp/commit.json"
          grep -q main.c "$tmp/range.json"
          grep -q main.c "$tmp/workspace.json"
          echo "CLI preview: SVN commit, range and working-copy all completed"
      - name: Cross-build Windows and macOS
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /tmp/ocr-win.exe ./cmd/opencodereview
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/ocr-mac ./cmd/opencodereview
      - name: Run file reading tests
        run: go test -count=1 ./internal/tool
      - name: Run all Go tests
        run: go test -count=1 ./...
      - name: Verify version and help
        run: |
          go run ./cmd/opencodereview --version
          go run ./cmd/opencodereview review --help | grep -F 'Review a specific SVN revision'
