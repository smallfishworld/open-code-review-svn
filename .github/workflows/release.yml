name: Release

on:
  push:
    tags: ['v*']
    # Publish the SVN fork from a versioned branch created only after main CI
    # passes. The release action creates the immutable tag in the same run;
    # GITHUB_TOKEN-created tags do not trigger a second release workflow.
    branches: ['release/v1.13.3-svn.1']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Exchanges a GitHub OIDC token for an npm publish token for every package
  # without publishing anything, so a trusted publisher misconfiguration is
  # caught before a tag is cut. Manual runs stop here.
  verify-trusted-publishing:
    if: github.event_name == 'workflow_dispatch'
    # npm trusted publishing rejects self-hosted runners, so this job and
    # npm-publish are cloud-hosted while the rest of the workflow is not.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Install jq
        run: apt-get update && apt-get install -y jq

      - name: Exchange OIDC token for every package
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::OIDC is unavailable. The job needs 'id-token: write'."
            exit 1
          fi

          REGISTRY_HOST=registry.npmjs.org
          ID_TOKEN=$(curl -sSf \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:${REGISTRY_HOST}" | jq -r '.value')

          if [ -z "$ID_TOKEN" ] || [ "$ID_TOKEN" = "null" ]; then
            echo "::error::Failed to obtain a GitHub OIDC token."
            exit 1
          fi

          echo "Presenting claims:"
          printf '%s' "$ID_TOKEN" | node -e '
            let raw = ""
            process.stdin.on("data", c => raw += c).on("end", () => {
              const p = JSON.parse(Buffer.from(raw.trim().split(".")[1], "base64url"))
              console.log(JSON.stringify({
                repository: p.repository,
                workflow_ref: p.workflow_ref,
                environment: p.environment,
                repository_visibility: p.repository_visibility,
              }, null, 2))
            })'
          echo

          # The main package plus every platform package it pulls in.
          PACKAGES=$(jq -r '[.name] + (.optionalDependencies // {} | keys) | .[]' package.json)

          failed=0
          for pkg in $PACKAGES; do
            escaped=$(printf '%s' "$pkg" | sed 's|/|%2f|')
            body=$(curl -s -o exchange.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${ID_TOKEN}" \
              -H 'Accept: application/json' \
              "https://${REGISTRY_HOST}/-/npm/v1/oidc/token/exchange/package/${escaped}")

            if [ "$body" = "201" ] && jq -e '.token | strings | select(length > 0)' exchange.json > /dev/null; then
              echo "OK       ${pkg}"
            else
              failed=1
              echo "FAILED   ${pkg} (HTTP ${body}): $(jq -r '.message // .error // "unknown error"' exchange.json 2>/dev/null)"
            fi
            rm -f exchange.json
          done

          echo
          if [ "$failed" -ne 0 ]; then
            echo "::error::At least one package is not configured for trusted publishing from this workflow."
            exit 1
          fi
          echo "All packages accept trusted publishing from this workflow."

  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: golang:1.26.9
      options: --cpus=2
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=${GITHUB_REF_NAME#release/}
          GIT_COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LD_FLAGS="-s -w -X main.Version=${VERSION} -X main.GitCommit=${GIT_COMMIT} -X main.BuildDate=${BUILD_DATE}"
          BIN_NAME=opencodereview-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BIN_NAME="${BIN_NAME}.exe"
          fi
          go build -ldflags "${LD_FLAGS}" -o "${BIN_NAME}" ./cmd/opencodereview
          echo "bin_name=${BIN_NAME}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.bin_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    container:
      image: ubuntu:24.04
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Generate release notes from commits
        id: notes
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME#release/}"
          if git rev-parse -q --verify "refs/tags/${CURRENT_TAG}" >/dev/null; then
            PREV_TAG=$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo "")
            CURRENT_REV="${CURRENT_TAG}"
          else
            PREV_TAG=$(git describe --tags --abbrev=0 "HEAD^" 2>/dev/null || echo "")
            CURRENT_REV=HEAD
          fi

          if [ -z "$PREV_TAG" ]; then
            RANGE="$CURRENT_REV"
          else
            RANGE="${PREV_TAG}..${CURRENT_REV}"
          fi

          FEATS=""
          FIXES=""
          REFACTORS=""
          DOCS=""
          OTHERS=""

          while IFS= read -r line; do
            msg="${line#* }"
            case "$msg" in
              feat*)  FEATS="${FEATS}- ${msg}
          ";;
              fix*)   FIXES="${FIXES}- ${msg}
          ";;
              refactor*) REFACTORS="${REFACTORS}- ${msg}
          ";;
              docs*)  DOCS="${DOCS}- ${msg}
          ";;
              *)      OTHERS="${OTHERS}- ${msg}
          ";;
            esac
          done < <(git log --oneline --no-merges "$RANGE")

          {
            echo "release_tag=${CURRENT_TAG}"
            echo "body<<RELEASE_NOTES_EOF"
            if [ -n "$FEATS" ]; then
              printf '## 🚀 Features\n\n%s\n' "$FEATS"
            fi
            if [ -n "$FIXES" ]; then
              printf '## 🐛 Bug Fixes\n\n%s\n' "$FIXES"
            fi
            if [ -n "$REFACTORS" ]; then
              printf '## 🔧 Refactoring\n\n%s\n' "$REFACTORS"
            fi
            if [ -n "$DOCS" ]; then
              printf '## 📖 Documentation\n\n%s\n' "$DOCS"
            fi
            if [ -n "$OTHERS" ]; then
              printf '## Other Changes\n\n%s\n' "$OTHERS"
            fi
            if [ -n "$PREV_TAG" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$PREV_TAG" "$CURRENT_TAG"
            fi
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Bundle and validate Linux x86_64 offline installer
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="${GITHUB_REF_NAME#release/}"
          RELEASE_VERSION="${RELEASE_VERSION#v}"
          bash scripts/package-linux-offline.sh opencodereview-linux-amd64 . "${RELEASE_VERSION}"
          test -s linux-x86-64-offline.tar.gz
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          tar -xzf linux-x86-64-offline.tar.gz -C "$stage"
          (cd "$stage/linux-x86-64-offline" && sha256sum -c SHA256SUMS && ./ocr --version)

      - name: Generate checksums
        run: sha256sum opencodereview-* linux-x86-64-offline.tar.gz | sort > sha256sum.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: ${{ steps.notes.outputs.body }}
          tag_name: ${{ steps.notes.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          files: |
            opencodereview-*
            linux-x86-64-offline.tar.gz
            sha256sum.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            opencodereview-*
            linux-x86-64-offline.tar.gz
            sha256sum.txt

  npm-publish:
    # The fork has an existing NPM_TOKEN secret. Support it without giving up
    # official trusted publishing if the registry connection is configured.
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    needs: release
    # Must stay cloud-hosted: npm refuses an OIDC exchange from a self-hosted
    # runner. The heavy build matrix above is unaffected.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: node:24
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trust workspace
        run: git config --global --replace-all safe.directory '*'

      - name: Install jq
        run: apt-get update && apt-get install -y jq

      - name: Configure npm authentication when fork token is available
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '%s\n' '//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}' >> "${HOME}/.npmrc"
            echo 'Configured npm token from repository secret'
          else
            echo 'No NPM_TOKEN configured; npm trusted publishing must be enabled'
          fi

      # Keep a tested npm baseline without downgrading a newer bundled version.
      - name: Ensure npm supports trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED=11.15.0
          CURRENT=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$REQUIRED" "$CURRENT" | sort -V | head -1)" != "$REQUIRED" ]; then
            echo "npm ${CURRENT} is below the tested baseline ${REQUIRED}, upgrading"
            npm install -g "npm@${REQUIRED}"
          fi
          npm --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          merge-multiple: true

      - name: Publish platform packages
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          VERSION="${VERSION#v}"
          PLATFORMS="darwin-arm64:opencodereview-darwin-arm64:opencodereview
          darwin-x64:opencodereview-darwin-amd64:opencodereview
          linux-arm64:opencodereview-linux-arm64:opencodereview
          linux-x64:opencodereview-linux-amd64:opencodereview
          win32-arm64:opencodereview-windows-arm64.exe:opencodereview.exe
          win32-x64:opencodereview-windows-amd64.exe:opencodereview.exe"

          for entry in $PLATFORMS; do
            platform_dir="${entry%%:*}"
            rest="${entry#*:}"
            dist_binary="${rest%%:*}"
            dest_name="${rest#*:}"
            pkg_dir="./npm/$platform_dir"
            mkdir -p "$pkg_dir/bin"
            cp "$dist_binary" "$pkg_dir/bin/$dest_name"
            chmod 755 "$pkg_dir/bin/$dest_name" 2>/dev/null || true

            jq --arg v "$VERSION" '.version = $v' "$pkg_dir/package.json" > "$pkg_dir/package.json.tmp"
            mv "$pkg_dir/package.json.tmp" "$pkg_dir/package.json"

            pkg_name=$(jq -r '.name' "$pkg_dir/package.json")
            already=$(npm view "${pkg_name}@${VERSION}" version 2>/dev/null || true)
            if [ "$already" = "$VERSION" ]; then
              echo "Skip: ${pkg_name}@${VERSION} already published"
            else
              npm publish "$pkg_dir" --access public --provenance --tag svn
              echo "Published: ${pkg_name}@${VERSION}"
            fi
          done

      - name: Inject version and optionalDependencies
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          VERSION="${VERSION#v}"
          jq --arg v "$VERSION" '
            .version = $v |
            .optionalDependencies |= with_entries(.value = $v)
          ' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: Publish to npm
        run: |
          VERSION="${GITHUB_REF_NAME#release/}"
          VERSION="${VERSION#v}"
          pkg_name=$(jq -r '.name' package.json)
          already=$(npm view "${pkg_name}@${VERSION}" version 2>/dev/null || true)
          if [ "$already" = "$VERSION" ]; then
            echo "Skip: ${pkg_name}@${VERSION} already published"
          else
            npm publish --access public --provenance --tag svn
            echo "Published: ${pkg_name}@${VERSION}"
          fi
