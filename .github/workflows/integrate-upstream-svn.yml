name: Rebuild SVN fork on upstream v1.13.3
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebase/upstream-v1.13.3
          fetch-depth: 0
          persist-credentials: true
      - name: Merge upstream without dropping SVN changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/alibaba/open-code-review.git
          git fetch upstream 375f64cd6f67a48a135da83cfcf59c52669a09cb
          if ! git merge --no-edit FETCH_HEAD; then
            echo '::error::Merge conflicts require SVN-aware code integration. No changes pushed.'
            git diff --name-only --diff-filter=U
            exit 1
          fi
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion
      - name: Build and test merged code
        run: |
          set -euo pipefail
          go build ./cmd/opencodereview
          go test -count=1 ./...
      - name: Push validated integration branch
        run: git push origin HEAD:refs/heads/rebase/upstream-v1.13.3
