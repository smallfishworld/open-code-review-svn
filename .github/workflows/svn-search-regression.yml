name: SVN Search Regression
on:
  push:
    branches:
      - fix/svn-native-code-search-and-file-find-20261013
      - main
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SVN
        run: |
          command -v svn || (sudo apt-get update && sudo apt-get install -y subversion)
          svn --version --quiet
      - name: Verify Go formatting
        run: |
          test -z "$(gofmt -s -l internal/tool/svn_files.go internal/tool/svn_search_test.go internal/tool/code_search.go internal/tool/file_find.go cmd/opencodereview/scan_cmd.go)"
      - name: Go build
        run: go build ./cmd/opencodereview
      - name: SVN search integration tests
        run: go test -count=1 -v ./internal/tool -run 'TestSVN'
      - name: All tool tests
        run: go test -count=1 ./internal/tool
      - name: Full Go suite
        run: go test -count=1 ./...
